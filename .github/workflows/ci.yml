name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # pip ignores [tool.uv.sources] (the local ../projector checkout) and
      # projector-engine is not on PyPI yet: install it from GitHub first so the
      # toaster install finds the requirement already satisfied.
      - name: Install projector-engine
        run: pip install "projector-engine @ git+https://github.com/augustin-bresset/projector.git@main"

      - name: Install
        run: pip install -e ".[dev,csf]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Test (pytest)
        run: pytest -q
