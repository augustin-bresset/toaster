[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toaster"
version = "0.1.0"
description = "Annotate lidar point clouds in 3D, with pluggable clustering/segmentation models."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Augustin Bresset", email = "augustin.bresset@gmail.com" }]
keywords = ["lidar", "point-cloud", "annotation", "segmentation", "clustering"]
dependencies = [
    "numpy",
    "PyYAML",
    "scikit-learn>=1.3",
    "laspy",
    "plyfile",
    "fastapi",
    "uvicorn[standard]",
    # Shared three.js point-cloud engine, served from projector's install via
    # projector.web_engine_dir(). projector is a sibling checkout in ~/dev,
    # resolved from there by [tool.uv.sources] below (editable).
    "projector",
    # Webview host for the desktop window. The pyside6 extra pulls PySide6 (LGPL,
    # with QtWebEngine) and the qtpy shim pywebview's Qt backend imports. For a
    # fully Qt-free host install system WebKitGTK and drop this to a bare pywebview.
    "pywebview[pyside6]",
]

[project.optional-dependencies]
# apairo 0.5.0+ for ChannelWriter (label write-back); pinned to the release tag.
apairo = ["apairo @ git+https://github.com/apairo-robotics/apairo.git@v0.5.0"]
open3d = ["open3d"]
hdbscan = ["hdbscan"]
csf = ["cloth-simulation-filter"]  # CSF ground-detection segmenter
models = ["onnxruntime-gpu"]
torch = ["torch"]
viewer3d = ["pyvista"]  # legacy VTK Viewer backend (toaster.viewer.PyVistaViewer)
# ruff pinned to the pre-commit rev (.pre-commit-config.yaml) so CI and the hook
# format identically — an unpinned ruff drifts and fails CI on code the hook passed.
dev = ["pytest", "ruff==0.15.22", "pre-commit", "httpx", "playwright"]  # playwright: `playwright install chromium`

# projector (the shared engine) is co-developed locally in ~/dev; resolve the
# dependency from the sibling checkout (editable) rather than from an index.
[tool.uv.sources]
projector = { path = "../projector", editable = true }

[project.scripts]
toaster = "toaster.desktop:main"
toaster-web = "toaster.api.server:main"

[project.urls]
Homepage = "https://github.com/augustin-bresset/toaster"
Repository = "https://github.com/augustin-bresset/toaster"
Issues = "https://github.com/augustin-bresset/toaster/issues"
Changelog = "https://github.com/augustin-bresset/toaster/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["toaster*"]

[tool.setuptools.package-data]
toaster = ["py.typed", "schemas/*.yaml", "web/*.html", "web/*.css", "web/*.svg", "web/*.png", "web/js/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
